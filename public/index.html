<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Warehouse · 家庭礼品仓库</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🍵</span>
      <div>
        <h1>Digital Warehouse</h1>
        <p class="subtitle">茶叶 · 酒品等送礼物品 —— 入库 / 出库 / 时间追踪</p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-export" class="btn ghost" title="导出全部数据为 JSON">⬇ 导出</button>
      <button id="btn-new" class="btn primary">＋ 入库登记</button>
    </div>
  </header>

  <!-- 页面切换 -->
  <nav class="tabs">
    <button class="tab active" data-page="stock">📦 在库物品</button>
    <button class="tab" data-page="outbound">📤 出库记录</button>
  </nav>

  <main>
    <!-- ============ 页面一：在库物品 ============ -->
    <section id="page-stock">
      <!-- 统计卡片 -->
      <section class="stats" id="stats">
        <div class="card"><div class="num" id="st-total">–</div><div class="label">在库记录</div></div>
        <div class="card muted"><div class="num" id="st-out-total">–</div><div class="label">出库记录</div></div>
      </section>

      <!-- 搜索 / 过滤 -->
      <section class="toolbar">
        <input id="search" type="search" placeholder="搜索名称、规格、存放位置、备注…" />
        <select id="filter-category"><option value="">全部分类</option></select>
        <select id="sort">
          <option value="-inDate">入库日期（新→旧）</option>
          <option value="inDate">入库日期（旧→新）</option>
          <option value="name">按名称</option>
        </select>
      </section>

      <!-- 列表 -->
      <section id="list" class="grid"></section>
      <div id="empty" class="hidden empty">还没有记录，点击右上角「入库登记」开始记录家里的茶叶、酒品吧。</div>
    </section>

    <!-- ============ 页面二：出库记录 ============ -->
    <section id="page-outbound" class="hidden">
      <section class="toolbar">
        <input id="ob-search" type="search" placeholder="搜索名称、送给谁、事由、备注…" />
        <select id="ob-filter-category"><option value="">全部分类</option></select>
        <select id="ob-sort">
          <option value="-outDate">出库日期（新→旧）</option>
          <option value="outDate">出库日期（旧→新）</option>
          <option value="name">按名称</option>
        </select>
      </section>
      <section id="ob-list" class="grid"></section>
      <div id="ob-empty" class="hidden empty">还没有出库记录。在「在库物品」页点击卡片上的「出库」即可登记送给谁。</div>
    </section>
  </main>


  <!-- 弹窗表单 -->
  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlg-title">入库登记</h2>
      <div class="form-grid">
        <label>名称 *<input name="name" required placeholder="例：贵州茅台酒" /></label>
        <label>分类
          <div class="cat-row">
            <select name="category" id="form-category"></select>
            <input name="newCategory" placeholder="新分类…" class="hidden" id="new-category" />
          </div>
        </label>
        <label>规格<input name="spec" placeholder="例：飞天 53%vol 500ml" /></label>
        <label>数量<input name="quantity" type="number" min="0" step="1" value="1" /></label>
        <label>单位
          <select name="unit">
            <option>件</option><option>瓶</option><option>盒</option><option>罐</option>
            <option>饼</option><option>提</option><option>箱</option><option>条</option>
          </select>
        </label>
        <label>入库日期<input name="inDate" type="date" /></label>
        <label>存放位置<input name="location" placeholder="例：酒柜上层 / 茶室博古架" /></label>
      </div>
      <label class="full">备注<textarea name="notes" rows="2" placeholder="谁送的、准备送给谁、放在哪…"></textarea></label>
      <div class="dlg-actions">
        <button type="button" id="btn-cancel" class="btn ghost">取消</button>
        <button type="submit" class="btn primary" id="btn-save">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 出库弹窗：登记送给谁 / 事由 -->
  <dialog id="dlg-out">
    <form id="out-form" method="dialog">
      <h2>📤 出库登记</h2>
      <p class="out-summary" id="out-summary"></p>
      <div class="form-grid">
        <label>送给谁 *<input name="recipient" required placeholder="例：王叔叔 / 李总" /></label>
        <label>事由<input name="reason" placeholder="例：送礼 / 自饮 / 宴请" /></label>
        <label>出库日期<input name="outDate" type="date" /></label>
      </div>
      <label class="full">备注<textarea name="notes" rows="2" placeholder="什么场合送的、还有回礼预期…"></textarea></label>
      <div class="dlg-actions">
        <button type="button" id="btn-out-cancel" class="btn ghost">取消</button>
        <button type="submit" class="btn primary" id="btn-out-save">确认出库</button>
      </div>
    </form>
  </dialog>

  <!-- 编辑出库记录弹窗 -->
  <dialog id="dlg-ob-edit">
    <form id="ob-edit-form" method="dialog">
      <h2>✏️ 编辑出库记录</h2>
      <p class="out-summary" id="ob-edit-summary"></p>
      <div class="form-grid">
        <label>送给谁<input name="recipient" placeholder="例：王叔叔 / 李总" /></label>
        <label>事由<input name="reason" placeholder="例：送礼 / 自饮 / 宴请" /></label>
        <label>出库日期<input name="outDate" type="date" /></label>
      </div>
      <label class="full">备注<textarea name="notes" rows="2"></textarea></label>
      <div class="dlg-actions">
        <button type="button" id="btn-ob-cancel" class="btn ghost">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <footer class="foot">digital-warehouse · v0.5 精简版 · 数据存储于本地 data/items.json</footer>
  <script src="app.js"></script>
</body>
</html>
